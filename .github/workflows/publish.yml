name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release on tag push
  id-token: write # required for `npm publish --provenance`

jobs:
  publish:
    name: build + publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version is read from "packageManager" in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node 20 (with npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first so workspace example typechecks against the freshly built
      # dist/ (where the `Window.__vitePretext` declaration ships).
      - name: Build plugin
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify the tag matches the package version
        # Refuses to publish if you forgot to bump version before tagging.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish to npm (with provenance)
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # GitHub auto-generates the release body from PRs merged since the
      # previous tag. Categorisation comes from `.github/release.yml`.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
