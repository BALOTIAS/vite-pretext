name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version is read from "packageManager" in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Plugin must be built first so workspace examples can resolve
      # `vite-pretext` types (their `Window.__vitePretext` augmentation lives
      # in dist/index.d.ts).
      - name: Build plugin
        run: pnpm build

      - name: Typecheck (root + workspaces)
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build examples
        run: pnpm -r build
