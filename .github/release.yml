# Configuration for GitHub's auto-generated release notes.
# Used by the "Generate release notes" button on the Releases page and by
# the `softprops/action-gh-release` step in .github/workflows/publish.yml
# (when generate_release_notes: true is set).
#
# PRs are sorted into categories by label. Apply labels to each PR before
# merging so the next release groups it correctly.

changelog:
  exclude:
    # Hide PRs labelled like this from release notes entirely.
    labels:
      - ignore-for-release
      - skip-changelog
    # Hide PRs from these authors (typically bots).
    authors:
      - dependabot
      - dependabot[bot]
      - github-actions
      - github-actions[bot]
  categories:
    - title: ⚠️ Breaking changes
      labels:
        - breaking
        - breaking-change
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
        - feat
    - title: 🐛 Fixes
      labels:
        - bug
        - fix
        - bugfix
    - title: 📚 Documentation
      labels:
        - documentation
        - docs
    - title: 🧪 Tests
      labels:
        - test
        - tests
    - title: 🧰 Maintenance
      labels:
        - chore
        - ci
        - refactor
        - dependencies
    # Catch-all for PRs that don't carry one of the labels above.
    - title: Other changes
      labels:
        - "*"
